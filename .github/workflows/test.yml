name: Test & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Authenticate npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.TEST_NPM_TOKEN }}" > ~/.npmrc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build

      # ── DX type contract ────────────────────────────────────────
      # tsc gate over the agent-friendly prop types (src/dx-types.test-d.tsx).
      # The build only type-checks the index import graph, so this catches a
      # relaxed input type being reverted (e.g. the Column `border` regression).
      - name: Type contract
        run: pnpm --filter @unlayer/react-elements typecheck

      - name: Converter typechecks
        run: pnpm --filter @unlayer/from-react-email typecheck && pnpm --filter @unlayer/migrate typecheck

      # ── Bundle size budget ──────────────────────────────────────
      # Fail if the react-elements ESM bundle exceeds 281.5KB.
      # Current size: about 280.5KB (0.1.22: about 76KB). Raised from 280.5KB
      # (about 0.9KB): a lazy component's <style> and <script> read to where a
      # browser ends them, a template's only Row left out of the design too, and
      # an async render failing at an error found before React renders.
      # Raised from 279KB
      # (about 1.5KB): a lazy component's HTML read as a browser reads it before
      # React 18's `javascript:` URLs are written in it, and an end tag that ends
      # nothing left out among the blocks.
      # Raised from 277.5KB
      # (about 0.5KB): a template's own root nested in it taking the render's
      # config and sanitizer, sections left out through providers and layouts
      # with `onError`, and Markdown URLs stopping at control tags.
      # Raised from 276KB
      # (about 1.6KB): react-dom's modules asked what they're doing only where
      # a render starts (every module a render under way has, or an app's page
      # was found rendering with, kept from the renders inside it), wrapped code
      # breaking a long token, and React 18's lazy async template said by name.
      # Raised from 275.5KB
      # (about 0.7KB): the first async render reaching the template before its
      # promises can fail, and a component's markup in a Column taking its
      # Tailwind classes as an Html block's. Raised from 275KB
      # (about 0.3KB): a video's URL kept from `videoUrl`, a layout's sections
      # given as props read where failed parts are left out, a Column saying it
      # leaves out markup a block is in, and React 18's stream comments read in
      # a <style>'s or <script>'s text. Raised from 273KB
      # (about 2.4KB): react-dom's probes keeping no answer found where the
      # call stack had no room, a part that failed beside one that suspended
      # in a <Suspense> said, a wrapper's hooks of another copy of React
      # named, a memo'd forwardRef's ref and a <title>'s text in parts on
      # React 18, and a wrapper's rows' keys taken as written. Raised from 270KB
      # (about 2.4KB): a <Link> in a component's markup a record of its own,
      # cleaned alone, an async render that failed settling react-dom's
      # stream before it rejects, and `pretty` keeping HTML with a NUL as it
      # renders. Raised from 268KB
      # (about 2.2KB): the sections a provider written as a component is given
      # each a part of their own under "omit". Raised from 266KB
      # (about 2KB): react-dom's probes keeping no answer from a render that
      # ran out of stack, a part left out of a lazy component's <Suspense>
      # listed in `omitted`, the plain text reading an image's tag past a `>`
      # in a quoted value (an email service's tag in its src), a template's
      # promise props handled as an async render starts (the first render's
      # fast failures ended the process), react-dom's stream piped once where
      # React 19.2 says all is ready twice, a class template whose constructor
      # binds its render rendered, and a provider or <StrictMode> around the
      # rows kept as a Fragment is (one section failing with "omit" left out
      # every row).
      # Raised from 265.5KB
      # (about 0.9KB): React 18's Node stream's buffer written only as far as
      # it filled it (no NULs), a part that fails in a <Suspense> in what a
      # lazy component renders failing the render, and the error that says how
      # to write one whose fallback holds blocks. Raised from 260.5KB
      # (about 4.8KB): HTML balanced as a browser's parser ends elements at a
      # start tag (a table straight in a table, a cell in a cell, an `<li>` in
      # an `<li>`), what a lazy component renders read no further than the
      # markers React wrote after it (a `<style>`, `<script>` or comment it
      # leaves open is its text, and every marker ended and read), and React
      # 18's `javascript:` URLs there written as React 19 writes them. Raised from 258KB
      # (about 2.4KB): another copy of React told only from a hook read off a
      # null dispatcher, an email service's `<% %>` tag kept in an Image's
      # src, a custom tool's values copied for each render, Markdown and
      # CodeBlocks charged to the render wherever React renders them, a class
      # left alone where React's dev build constructs it to name it, and what
      # links an Image said. Raised from 255.5KB
      # (about 2.4KB): each marker and placeholder of the collecting render
      # bound to a part React kept, the components a <Link> renders in
      # recorded so its markup is cleaned wherever it lands, and an async
      # render's places in tree order. Raised from 250.5KB
      # (about 5.1KB): rich text's markup read with the browser-like tag reader
      # the Markdown sanitizer uses, its tags balanced, an async component in a
      # <Head>'s style, script or title waited for, an element placed twice
      # called in each place, Elements' own contexts stamped with the render
      # that set them and kept per React with its renders under way, and a
      # memo'd or forwardRef'd Row, Column or block recorded as itself.
      # Raised from 244.5KB
      # (about 5.9KB): what fails where React handles it itself said (a
      # <Suspense>'s fallback marked and read, React's stream errors recorded,
      # a class's lifecycles and a promise child caught), react-dom's stream
      # module settled after each async render, a template's markup read from
      # inside its wrapper, a class whose render is a class field, every part
      # that fails counted in an async render, and plain-text lines never
      # wrapped inside a template tag. Raised from 242KB
      # (about 2.4KB): a lazy component rendered where it is (Elements'
      # components in it collected through a context), a style's or script's
      # HTML kept out of the parse, the providers React leaves in a module popped
      # after each render, async renders failing by name where react-dom can't
      # render, and the render count kept apart from 0.2.1's. Raised from 236.5KB
      # (about 5.2KB): a render started inside a component of an app's
      # renderToString renders with another module of react-dom's, found with a
      # synchronous require as 0.2.1 found it, and told by a class component's
      # useTransition (src/engine/react-dom.ts), or fails by name. Raised from 229.5KB
      # (about 7KB): templates render with react-dom/server through React's public
      # API only (src/engine: the element tree prepared for react-dom, its HTML read
      # back with the HTML a template gives kept out of it, template wrappers and a
      # lazy template's root called in renders of their own, a <Head>'s raw text
      # on React 19, and the named errors where react-dom can't render), where the
      # walker, its hooks dispatcher, its tree ids and the React version table
      # went. Raised from 224.5KB
      # (about 1.1KB with the round before): rich text's stray brackets kept as
      # text, a root's ids kept to what they hold, object children failing the
      # render, style values' double quotes written as references, Tailwind
      # widths on images with a natural size, and a Heading's level checked.
      # Raised from 222.5KB
      # (about 1.7KB): an email service's tags kept whole in background URLs
      # with their encoding checked, rich text's comments left out and its
      # double quotes as written, a lone Link's tags kept, a Table's cells from
      # data written as text, and plain text's heading tags kept as written.
      # Raised from 221KB
      # (about 1.1KB): display conditions written around rows and blocks, an
      # email service's tags kept whole in rich text and background URLs, a tag
      # that never ends left out of rich text, and a Table's typed props named.
      # Raised from 219.5KB
      # (about 1.8KB): a render's work shared across copies of Elements and
      # with all the code it runs, plain text's placeholders kept from text
      # that decodes to them and blocked URLs left out, and text placed
      # straight in a Row or Column said once per render. Raised from 218KB
      # (about 1.5KB): a render's shared work kept to its own render (template
      # wrappers, nested renders), code themes read by their own names, and
      # plain text's skip names read as written. Raised from 216KB
      # (about 1.9KB): Markdown's and code's work is shared across a render,
      # not counted per block, plain text's tag names are indexed by their
      # parts, and a rich text block's markup is given to <Tailwind> with the
      # render's other classes. Raised from 207KB
      # (about 8.7KB): HTML's plain text (htmlToPlainText) is read in time
      # linear in its size by scanners of its own, where its regexes read
      # unclosed tags again from each place they could start (40KB took a
      # minute); a content prop given as null renders nothing, a Video's id
      # can't end its player's URL, and rich text's markup is read in time
      # linear in its size. Raised from 206KB
      # (about 1KB): a Row's anchor, a Video's link and thumbnail and a
      # Social icon's image are kept from adding markup, a Font's
      # javascript: URL loads nothing, Tailwind classes in a Heading's or a
      # Button's children and on a lone <Link> are inlined, a prop given as
      # null is one not given, and a <script>'s or <style>'s text is left
      # out of rich text children. Raised from 204.5KB
      # (about 1.3KB): the editor's exporters' own links (a Button's, an
      # Image's, a Menu's, a Social's) are given no URL that runs code, in
      # the HTML and the design, and a null Menu item or Social icon is
      # skipped. Raised from 203KB
      # (about 1.8KB): a javascript: URL is written as one that throws with
      # React 18 too, a render's Tailwind scopes are given only the records
      # in them, with a key for the render (its first 2,000 classes are
      # read), and a plugin's error for a component's classes is that
      # component's; a link of null is none. Raised from 202.5KB
      # (about 0.4KB): a render gives a <Tailwind>'s rewrite what it
      # collected, so its classes are compiled at once (one at a time, a
      # few thousand from data took seconds), and a link's target, a Menu
      # item's text or a Social icon's name that isn't a string is a new tab
      # or its text. Raised from 200KB
      # (about 2.2KB): rich text in children reads a link's URL with its
      # character references decoded (the Markdown sanitizer's decoder, now
      # shared), a link's target that could end its attribute is a new tab,
      # the plain text keeps an email service's <%name%> tags, the other
      # entries can leave a part of a template out alone (a Markdown table
      # past the cells it can have), a context a template doesn't provide
      # is worked out once per render, and React's idle dispatcher isn't
      # taken for a running render. Raised from 198.5KB
      # (about 1.5KB): a context a template doesn't provide reads its default
      # (React's two values for it compared, the default seen kept per
      # context), and a <Head>'s style and script text is escaped whole,
      # whatever writes it, against its end tag and those of what it's in (the
      # format context a head's walk carries). Raised from 198KB
      # (about 0.3KB): the plain text reads links before headings and
      # preformatted text, each attribute whole, with their URLs set aside
      # till the end, and doesn't wrap the URLs listed after the text.
      # Raised from 194.5KB
      # (about 3.4KB): markup is written as react-dom writes it for the
      # installed React, a <select>'s value marking its options (the format
      # context the walk carries), the form controls' rules and React 19's
      # for a style's, script's and title's text, and a <Head>'s style and
      # script text written as given in every React. Raised from 193.5KB
      # (about 1KB): a <Suspense> around the template is unwrapped, a root
      # the walk of a template with no root meets is said, and which Row or
      # Column failed and what an async render compiled for its <Tailwind>s
      # are kept in the render's scope. Raised from 193KB
      # (about 0.6KB): each render function makes a scope of its own, the
      # user's code (components, exporters, heads, onError) runs outside it,
      # what unwrapping a template finds is kept in its render's scope, and a
      # lazy template is unwrapped. Raised from 192KB
      # (about 0.7KB): what's in a <Head> is walked with the template (its
      # components waited for, in the error policy), a head function that
      # fails is in the error policy, renderToJson throws a template
      # wrapper's error as it is, and what the walker says once and its style
      # names are bounded. Raised from 191KB
      # (about 1KB): a template with no root renders as a root's content
      # (walked once, its rows rendered with the render's config), and the
      # async renderers collect it as they collect a root's. Raised from 190KB
      # (about 1.3KB): Elements' roots are known by a marker shared across
      # copies (an older copy's by its code), a suspension reaches the
      # <Suspense> around it whatever `onError` says, and an async template
      # with no root is rendered without calling it again. Raised from 189KB
      # (about 1.2KB): a template, a component around its root and a class
      # component that throw a promise (React 18's Suspense) are waited for by
      # the async renderers and said by the synchronous ones, and a root of
      # another copy of Elements renders as this copy's. Raised from 187KB
      # (about 2KB): a Row or Column whose own exporter fails is left out with
      # `onError: "omit"`, as a block is (a Column with its cell, its Row made
      # again without it), instead of failing the render. Raised from 173.5KB
      # (about 13KB): Divider, Html, Menu and Social write their web and
      # document HTML without react-dom/server, which can't run in an edge
      # runtime or a React Server Components layer (src/exporters/, about 7KB,
      # writing with the walker's host markup, one table of React 18's and 19's
      # rules for both), and what makes the renders faster: the template
      # collected as a tree of its records (no markers parsed back), its model,
      # values and the design's copies made once (src/model/, the head's reuse,
      # pxMerged), and a root's and Row's HTML written without a walk. The
      # async walk's holes are the async entry's. Raised from 131.5KB
      # (about 41KB) for the walker (src/engine), the renderer Elements renders
      # templates with instead of react-dom: the walk itself, its hooks
      # dispatcher, React's attribute and style tables for host markup, the
      # async walk's holes and tree-order output, the React version table and
      # its self-check, and the error policy (RenderError, `onError`). It
      # replaces react-dom in Elements' own renders, which was never counted
      # here (a peer dependency); the collecting render's react-dom plumbing
      # (the second react-dom module, blind mode, the Sentinel, calling a
      # failed component again) went with it. Raised from 130.5KB
      # (about 1KB) so the async renderers collect where Elements' React isn't
      # react-dom's (Next.js's server layers) as the synchronous ones do, and a
      # template whose Rows render as HTML instead of being collected fails
      # instead of giving a broken email. Raised from 126KB for
      # editor parity: the editor's base stylesheet for each mode in the
      # document's head (about 1.1KB of CSS), a Paragraph rendered from the text
      # its design holds, a root's `fonts` and its `displayMode` in the design,
      # and blocks of another copy of Elements rendered as this one's. Most of
      # the growth since 0.1.22 is the render that collects a template's rows and blocks (one React render,
      # so hooks, context, Fragments and the user's components work as React
      # renders them; a component that throws, suspends or is async left out
      # with a message naming it; markup and blocks rendered to strings inside
      # the user's components kept), phone device-override CSS, visibility
      # settings, escaping of the values users give (Heading/Button text,
      # link URLs, menu text, social links, ids, fonts, the text direction), and
      # rendering where a bundler gives Elements another copy of React than
      # react-dom's (Next.js's server layers), and loading a second module of
      # react-dom's when Elements is called inside a renderToString it renders with,
      # and leaving out Columns inside markup in a Row, as 0.1.22 did, and
      # Tailwind classes (the hook a <Tailwind> scope uses in the collected
      # render; <Tailwind>, Tailwind itself, the code that reads its CSS and each
      # component's class table are in the separate `tailwind` entry, not counted),
      # rich text children (inline JSX and components in Paragraph, Heading and
      # Button text), code kept in plain text, what a <Font> gives the head and
      # the root, right-to-left text alignment, and `style`/`className` on the
      # element each component renders, <Link>, the plain text's options, and
      # an <UnlayerProvider>'s config read by the roots and the render functions,
      # and a link or rule in a Column kept as HTML where its block can't hold it.
      # The Markdown parser, the code highlighter, <Font>, <Head> and the
      # design-to-code converter (`codegen`) are in their own entries.
      # The budget tracks the unminified ESM output as a proxy for code volume;
      # it still flags accidental dependency bundling (any real dep is 10KB+).
      - name: Check bundle size
        run: |
          BUNDLE="packages/react/dist/index.js"
          SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          MAX_SIZE=281500
          echo "Bundle: $BUNDLE"
          echo "Size: $SIZE bytes (budget: $MAX_SIZE bytes)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Bundle size $SIZE exceeds budget of $MAX_SIZE bytes"
            exit 1
          fi
          echo "✅ Bundle size within budget"

      - name: Run tests
        run: pnpm test

      - name: Run test coverage
        run: pnpm test:coverage

      # ── CSP safety gate ─────────────────────────────────────────
      # Imports + renders the built bundle under V8's
      # --disallow-code-generation-from-strings (a CSP without 'unsafe-eval').
      # HARD gate: fails if this package OR its pinned @unlayer/exporters
      # evaluates a string at import/render. Stays red until the catalog pins a
      # CSP-safe (precompiled-template) @unlayer/exporters release.
      - name: CSP safety gate
        run: pnpm --filter @unlayer/react-elements test:csp

      # ── Storybook browser smoke test ────────────────────────────
      # Opens every story in headless Chromium and asserts each component
      # paints visible content with no console / page errors. Runs against the
      # production static build (storybook build → http-server).
      - name: Install Playwright Chromium
        run: pnpm --filter @unlayer/react-elements exec playwright install --with-deps chromium

      - name: Content workflow examples (HTML, JSON, and real PDF; no email delivery)
        run: |
          pnpm --filter @unlayer/content-workflows-example typecheck
          pnpm --filter @unlayer/content-workflows-example test

      # ── Browser import/runtime safety gate ──────────────────────
      # Bundles the shipped package entry as a browser consumer would, then
      # imports and renders inside Chromium without a Node `process` global.
      # Includes a negative control that reproduces the original
      # `process.env.IS_OFFLINE` crash so a green result proves the gate works.
      - name: Browser runtime safety gate
        run: pnpm --filter @unlayer/react-elements test:browser-runtime

      # ── Browser E2E gate (rendered documents) ───────────────────
      # Renders full documents with the BUILT dist for all three modes and
      # asserts in real Chromium: every <p> computes to 0px margins (the
      # inline reset beats the UA default), exactly one <body> in the DOM,
      # title/styles/links parsed, no console or page errors. Includes a
      # negative control proving the gate detects the failures it guards.
      - name: Browser E2E gate
        run: pnpm --filter @unlayer/react-elements test:e2e

      # ── Migration fidelity smoke test ───────────────────────────
      # Converts the committed fixture templates both ways (codemod and
      # runtime) and renders them next to their React Email originals in
      # Chromium at desktop and phone widths. Fails on lost or added content,
      # a word shown at another size on desktop, or words moved (on phones,
      # only for the fixtures that match there).
      - name: Migration fidelity smoke test
        run: pnpm --filter @unlayer/from-react-email test:fidelity

      # ── Migration check vs Chromium (differential) ──────────────
      # 400 fixed seeds: one side of a base (hand-written documents and the
      # fixture templates' renders) is mutated, Chromium decides whether a
      # reader sees the two differently, and the check must fail every pair
      # it does. Committed fixtures (test/differential/) must still differ in
      # Chromium and fail the check. A false pass writes its pair to
      # .bench-out/differential/ and fails the job.
      - name: Migration check vs Chromium
        run: pnpm --filter @unlayer/from-react-email test:differential

      - name: Storybook smoke test
        run: pnpm --filter @unlayer/react-elements test-storybook:ci

      # ── Storybook visual-drift gate ─────────────────────────────
      # Fingerprints the computed styles and the visible text of every story
      # at desktop and mobile widths (reusing the static build from the smoke
      # test) and diffs against the committed baseline. Fails naming the
      # exact stories and properties (or lines of text) that changed —
      # answers "did any story change?" without paging through them by hand.
      - name: Storybook visual-drift gate
        run: pnpm --filter @unlayer/react-elements test:visual

      # ── Next.js integration test ────────────────────────────────
      # Packs the built react-elements as a tarball and installs it
      # in a real Next.js app — exactly like a consumer would.
      # Catches SSR, bundling, and Server Component compatibility issues
      # that unit tests can't detect.
      # The tarball has its license: pnpm adds the repository's only where no file in the package matches LICENSE,
      # which THIRD_PARTY_LICENSES.md does (a 0.3.0 build had none). And its types import nothing built into the
      # package (highlight.js, marked), which consumers don't install (a 0.3.0 build's did: TS2307 without skipLibCheck):
      # no import or export from them in either quotes, and no `import("…")` type (a comment may name them).
      - name: Pack react-elements
        run: |
          cd packages/react
          pnpm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/unlayer-react-elements-*.tgz)
          tar tzf "$TARBALL" | grep -qx package/LICENSE || { echo "::error::$TARBALL has no LICENSE"; exit 1; }
          if grep -nE "[\"'(](highlight\.js|marked)[/\"']" dist/*.d.ts dist/*.d.cts | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|/\*|//)"; then echo "::error::the types import a package built into Elements"; exit 1; fi
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      # migrate has no LICENSE of its own: its tarball gets the repository's from pnpm (as publish.yml checks, where
      # a missing one would fail the release instead).
      - name: Pack migrate
        run: |
          cd packages/migrate
          pnpm pack --pack-destination /tmp
          MIGRATE_TARBALL=$(ls /tmp/unlayer-migrate-*.tgz)
          tar tzf "$MIGRATE_TARBALL" | grep -qx package/LICENSE || { echo "::error::$MIGRATE_TARBALL has no LICENSE"; exit 1; }

      - name: Next.js integration build
        run: |
          cd tests/nextjs-integration
          npm install "$TARBALL"
          npm run build
          # An email rendered in a route handler and a Server Component comes out as one (tables, a design with
          # its rows), with the synchronous and the async renderers, with Elements bundled into Next's server
          # layers (no serverExternalPackages); an App Router
          # edge route builds (Turbopack) and renders or says to render in the Node.js runtime, and Pages Router
          # API routes (Node.js and edge) render. Each route renders with every entry of Elements too.
          npm run verify

      # ── Next.js integration build with webpack ──────────────────
      # The same app built with webpack, Next.js 15's default bundler (`next build` without --turbopack). It fails
      # the build of a module that imports by name what React's react-server build doesn't export (createContext,
      # useContext), in an edge route, where Turbopack builds it.
      - name: Next.js integration build (webpack)
        run: |
          cd tests/nextjs-integration
          npm run build:webpack
          npm run verify

      # ── More consumers ──────────────────────────────────────────
      # The packed package in Next.js 14 with React 18 (a route handler and a Server Component that render an
      # email) and in Jest 30's jsdom environment with React 19 (importing it, and a design worked out inside a
      # page's react-dom/server render). An early 0.2.0 build broke both where 0.1.22 worked.
      - name: Next.js 14 and Jest 30 consumers
        run: |
          cd tests/next14-integration
          npm install
          npm install --no-save "$TARBALL"
          npm run build
          npm run verify
          cd ../jest-integration
          npm install
          npm install --no-save "$TARBALL"
          npm test

      # ── Next.js 16 with Cache Components ────────────────────────
      # create-next-app's setup since Next.js 16: a route handler, a Server Component and a Client Component that
      # render an email are prerendered when the app builds, and the build fails if a render reads a random number
      # or the date. 0.2.0's did (crypto.getRandomValues() for each render's nonce), so no new app could build.
      # The async renderers render one in a route handler and a Server Component when it's requested.
      - name: Next.js 16 consumer (Cache Components)
        run: |
          cd tests/next16-integration
          npm install
          npm install --no-save "$TARBALL"
          npm run build
          npm run verify

      # ── A project's own Tailwind CSS 3 and prettier 2 ───────────
      # Tailwind and prettier are optional peer dependencies of any version: npm keeps a project's own, older ones
      # (an 0.3.0 build's ">=4.0.0" and ">=3.0.0" failed `npm install` with ERESOLVE), and what needs Tailwind CSS 4 or
      # prettier 3 says to upgrade, as a module and required (tests/older-peers/verify.mjs).
      - name: Project with Tailwind CSS 3 and prettier 2
        timeout-minutes: 10
        run: |
          DIR=$(mktemp -d)
          cp tests/older-peers/package.json tests/older-peers/verify.mjs "$DIR"
          cd "$DIR"
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund "$TARBALL"
          node verify.mjs

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            coverage/
          retention-days: 30

  # ── React versions ──────────────────────────────────────────
  # The react package's suite on each React it supports: see
  # react-versions.yml, which publish.yml runs before a release too.
  react-versions:
    name: React versions
    uses: ./.github/workflows/react-versions.yml
    secrets: inherit
