name: Test & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# A new push to a pull request cancels the run still going on its older head.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four jobs run side by side, each installing and building the packages, so a run takes as long as its
# slowest job (the codemod's tests, about four minutes) rather than all of them in a row.
jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Authenticate npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.TEST_NPM_TOKEN }}" > ~/.npmrc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build

      # ── DX type contract ────────────────────────────────────────
      # tsc gate over the agent-friendly prop types (src/dx-types.test-d.tsx).
      # The build only type-checks the index import graph, so this catches a
      # relaxed input type being reverted (e.g. the Column `border` regression).
      - name: Type contract
        run: pnpm --filter @unlayer/react-elements typecheck && pnpm --filter @unlayer-internal/elements-core typecheck && pnpm --filter @unlayer-internal/elements-exporters typecheck && pnpm --filter @unlayer/elements-pdf typecheck && pnpm --filter @unlayer/elements-image typecheck

      - name: Converter typechecks
        run: pnpm --filter @unlayer/from-react-email typecheck && pnpm --filter @unlayer/migrate typecheck

      # ── Bundle size budget ──────────────────────────────────────
      # Fail if the react-elements ESM bundle exceeds 442.5KB. It holds today's
      # components and the new engine they render through: its core and writers
      # (about 216KB, the /primitives entry's, without its JSX API); the lowering
      # of today's designs into its tree (src/compat, about 119KB: each block and
      # frame in each case 0.2.1 drew it, what can't be read said); the render that
      # collects a template's rows and blocks, with the head and phone CSS of
      # open HTML (src/utils, about 66KB); the values today's components read and
      # plain text (the shared package, about 24KB); the components themselves
      # (about 14KB).
      # The budget tracks the unminified ESM output as a proxy for code volume;
      # it still flags accidental dependency bundling (any real dep is 10KB+).
      # Raise it on purpose, with what grew.
      - name: Check bundle size
        run: |
          BUNDLE="packages/react/dist/index.js"
          SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          MAX_SIZE=446800
          echo "Bundle: $BUNDLE"
          echo "Size: $SIZE bytes (budget: $MAX_SIZE bytes)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Bundle size $SIZE exceeds budget of $MAX_SIZE bytes"
            exit 1
          fi
          echo "✅ Bundle size within budget"

      # The new engine's entry (/primitives) has its own budget: about 242KB
      # unminified ESM. Its core (the components' definitions, validation, layout,
      # about 117KB), its writers (email, page, print HTML and plain text, about
      # 102KB), its JSX API (about 17KB) and what it shares with the main entry's
      # render (about 5KB). Raise it on purpose, with what grew.
      - name: Check /primitives bundle size
        run: |
          BUNDLE="packages/react/dist/primitives.js"
          # A bundle that wasn't built (or came out empty) fails here rather than passing the checks below.
          test -s "$BUNDLE" && test -s "packages/react/dist/primitives.cjs" || { echo "::error::$BUNDLE wasn't built"; exit 1; }
          SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          MAX_SIZE=244300
          echo "Size: $SIZE bytes (budget: $MAX_SIZE bytes)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::/primitives bundle size $SIZE exceeds budget of $MAX_SIZE bytes"
            exit 1
          fi
          echo "✅ /primitives bundle within budget"

      # The builder adapter's entry (/builder: toDesign and fromDesign) has its
      # own budget: about 450KB unminified ESM. The adapter itself (the hidden
      # properties' manifest, reading designs and the builder's rich text, the JSX
      # printer, about 127KB); the core and writers it lays out and writes locked
      # markup with (about 217KB); today's components and renderToJson, which it
      # writes the builder's design through (about 62KB); the /primitives JSX API it
      # reads templates with (about 11KB), the shared package (about 23KB) and
      # today's value and run parsers (about 16KB). It leaves out what draws today's
      # components through React, which it doesn't call (tsup.config.ts). Raise it on
      # purpose, with what grew.
      - name: Check /builder bundle size
        run: |
          BUNDLE="packages/react/dist/builder.js"
          test -s "$BUNDLE" && test -s "packages/react/dist/builder.cjs" || { echo "::error::$BUNDLE wasn't built"; exit 1; }
          SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          MAX_SIZE=451700
          echo "Size: $SIZE bytes (budget: $MAX_SIZE bytes)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::/builder bundle size $SIZE exceeds budget of $MAX_SIZE bytes"
            exit 1
          fi
          echo "✅ /builder bundle within budget"

      # The package no longer depends on @unlayer/exporters: no bundle imports it (a message naming it doesn't count).
      - name: No bundle imports @unlayer/exporters
        run: |
          if grep -lE "(from |import ?\(?|require\()[\"']@unlayer/exporters" packages/*/dist/*.js packages/*/dist/*.cjs; then
            echo "::error::a bundle imports @unlayer/exporters"
            exit 1
          fi

      # Every package's unit tests but the codemod's (their own job) and react's, which run once, with coverage.
      - name: Run tests
        run: pnpm -r --filter "./packages/*" --filter "!@unlayer/react-elements" --filter "!@unlayer/migrate" run test

      - name: Run test coverage
        run: pnpm test:coverage

      # ── CSP safety gate ─────────────────────────────────────────
      # Imports + renders the built bundle under V8's
      # --disallow-code-generation-from-strings (a CSP without 'unsafe-eval').
      # HARD gate: fails if this package evaluates a string at import/render.
      - name: CSP safety gate
        run: pnpm --filter @unlayer/react-elements test:csp

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            coverage/
          retention-days: 30

  # @unlayer/migrate's tests: the slowest suite (the codemod converts and checks whole templates).
  codemod:
    name: Codemod tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Authenticate npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.TEST_NPM_TOKEN }}" > ~/.npmrc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build

      - name: Codemod tests
        run: pnpm --filter @unlayer/migrate test

  storybook:
    name: Storybook smoke and visual drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Authenticate npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.TEST_NPM_TOKEN }}" > ~/.npmrc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlayer/react-elements exec playwright install --with-deps chromium

      # ── Storybook browser smoke test ────────────────────────────
      # Opens every story in headless Chromium and asserts each component
      # paints visible content with no console / page errors. Runs against the
      # production static build (storybook build → http-server).
      - name: Storybook smoke test
        run: pnpm --filter @unlayer/react-elements test-storybook:ci

      # ── Storybook visual-drift gate ─────────────────────────────
      # Fingerprints the computed styles and the visible text of every story
      # at desktop and mobile widths (reusing the static build from the smoke
      # test) and diffs against the committed baseline. Fails naming the
      # exact stories and properties (or lines of text) that changed —
      # answers "did any story change?" without paging through them by hand.
      - name: Storybook visual-drift gate
        run: pnpm --filter @unlayer/react-elements test:visual

  browser:
    name: Browser gates and consumer apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Authenticate npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.TEST_NPM_TOKEN }}" > ~/.npmrc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlayer/react-elements exec playwright install --with-deps chromium

      - name: Content workflow examples (HTML, JSON, and real PDF; no email delivery)
        run: |
          pnpm --filter @unlayer/content-workflows-example typecheck
          pnpm --filter @unlayer/content-workflows-example test

      # ── Browser import/runtime safety gate ──────────────────────
      # Bundles the shipped package entry as a browser consumer would, then
      # imports and renders inside Chromium without a Node `process` global.
      # Includes a negative control that reproduces the original
      # `process.env.IS_OFFLINE` crash so a green result proves the gate works.
      - name: Browser runtime safety gate
        run: pnpm --filter @unlayer/react-elements test:browser-runtime

      # ── Browser E2E gate (rendered documents) ───────────────────
      # Renders full documents with the BUILT dist for all three modes and
      # asserts in real Chromium: every <p> computes to 0px margins (the
      # inline reset beats the UA default), exactly one <body> in the DOM,
      # title/styles/links parsed, no console or page errors. Includes a
      # negative control proving the gate detects the failures it guards.
      - name: Browser E2E gate
        run: pnpm --filter @unlayer/react-elements test:e2e

      # Elements primitives: what Chromium lays out matches the widths the resolver works out,
      # on desktop and on phones (packages/exporters/test/browser).
      - name: Primitives layout gate (web and email)
        run: pnpm --filter @unlayer-internal/elements-exporters test:browser

      # A Document's PDF (written by react-pdf, without a browser) laid out as its print HTML is: Chromium measures
      # the HTML, pdf.js reads the PDF, and each line starts within a point of the other (packages/pdf/test/browser).
      - name: PDF laid out as its print HTML
        run: pnpm --filter @unlayer/elements-pdf test:browser

      # A Canvas's image (written by Satori and resvg, without a browser) drawn as Chromium draws the Canvas's HTML,
      # with the same font file: pixel by pixel, the edges of shapes and letters aside (packages/image/test/browser).
      - name: Image drawn as its Canvas's HTML
        run: pnpm --filter @unlayer/elements-image test:browser

      # ── Migration fidelity smoke test ───────────────────────────
      # Converts the committed fixture templates both ways (codemod and
      # runtime) and renders them next to their React Email originals in
      # Chromium at desktop and phone widths. Fails on lost or added content,
      # a word shown at another size on desktop, or words moved (on phones,
      # only for the fixtures that match there).
      - name: Migration fidelity smoke test
        run: pnpm --filter @unlayer/from-react-email test:fidelity

      # ── Migration check vs Chromium (differential) ──────────────
      # 400 fixed seeds: one side of a base (hand-written documents and the
      # fixture templates' renders) is mutated, Chromium decides whether a
      # reader sees the two differently, and the check must fail every pair
      # it does. Committed fixtures (test/differential/) must still differ in
      # Chromium and fail the check. A false pass writes its pair to
      # .bench-out/differential/ and fails the job.
      - name: Migration check vs Chromium
        run: pnpm --filter @unlayer/from-react-email test:differential

      # ── Next.js integration test ────────────────────────────────
      # Packs the built react-elements as a tarball and installs it
      # in a real Next.js app — exactly like a consumer would.
      # Catches SSR, bundling, and Server Component compatibility issues
      # that unit tests can't detect.
      - name: Pack react-elements
        run: |
          cd packages/react
          pnpm pack --pack-destination /tmp
          echo "TARBALL=$(ls /tmp/unlayer-react-elements-*.tgz)" >> $GITHUB_ENV

      - name: Next.js integration build
        run: |
          cd tests/nextjs-integration
          npm install "$TARBALL"
          npm run build
          # An email rendered in a route handler and a Server Component comes out as one (tables, a design with
          # its rows), with Elements bundled into Next's server layers (no serverExternalPackages); an edge route
          # builds (Turbopack) and renders or says to render in the Node.js runtime.
          npm run verify

      # ── More consumers ──────────────────────────────────────────
      # The packed package in Next.js 14 with React 18 (a route handler and a Server Component that render an
      # email) and in Jest 30's jsdom environment with React 19 (importing it, and a design worked out inside a
      # page's react-dom/server render). An early 0.2.0 build broke both where 0.1.22 worked.
      - name: Next.js 14 and Jest 30 consumers
        run: |
          cd tests/next14-integration
          npm install
          npm install --no-save "$TARBALL"
          npm run build
          npm run verify
          cd ../jest-integration
          npm install
          npm install --no-save "$TARBALL"
          npm test

      # ── Next.js 16 with Cache Components ────────────────────────
      # create-next-app's setup since Next.js 16: a route handler, a Server Component and a Client Component that
      # render an email are prerendered when the app builds, and the build fails if a render reads a random number
      # or the date. 0.2.0's did (crypto.getRandomValues() for each render's nonce), so no new app could build.
      - name: Next.js 16 consumer (Cache Components)
        run: |
          cd tests/next16-integration
          npm install
          npm install --no-save "$TARBALL"
          npm run build
          npm run verify
