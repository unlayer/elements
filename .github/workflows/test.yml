name: Test & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Authenticate npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.TEST_NPM_TOKEN }}" > ~/.npmrc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build

      # ── DX type contract ────────────────────────────────────────
      # tsc gate over the agent-friendly prop types (src/dx-types.test-d.tsx).
      # The build only type-checks the index import graph, so this catches a
      # relaxed input type being reverted (e.g. the Column `border` regression).
      - name: Type contract
        run: pnpm --filter @unlayer/react-elements typecheck

      # ── Bundle size budget ──────────────────────────────────────
      # Fail if the react-elements ESM bundle exceeds 75KB.
      # Current size: ~70KB (14+ components + image width-pinning geometry
      # + per-mode full-document shells for renderToHtml).
      # The budget tracks the unminified ESM output as a proxy for code volume;
      # it still flags accidental dependency bundling (any real dep is 10KB+).
      - name: Check bundle size
        run: |
          BUNDLE="packages/react/dist/index.js"
          SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          MAX_SIZE=75000
          echo "Bundle: $BUNDLE"
          echo "Size: $SIZE bytes (budget: $MAX_SIZE bytes)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Bundle size $SIZE exceeds budget of $MAX_SIZE bytes"
            exit 1
          fi
          echo "✅ Bundle size within budget"

      - name: Run tests
        run: pnpm test

      - name: Run test coverage
        run: pnpm test:coverage

      # ── CSP safety gate ─────────────────────────────────────────
      # Imports + renders the built bundle under V8's
      # --disallow-code-generation-from-strings (a CSP without 'unsafe-eval').
      # HARD gate: fails if this package OR its pinned @unlayer/exporters
      # evaluates a string at import/render. Stays red until the catalog pins a
      # CSP-safe (precompiled-template) @unlayer/exporters release.
      - name: CSP safety gate
        run: pnpm --filter @unlayer/react-elements test:csp

      # ── Storybook browser smoke test ────────────────────────────
      # Opens every story in headless Chromium and asserts each component
      # paints visible content with no console / page errors. Runs against the
      # production static build (storybook build → http-server).
      - name: Install Playwright Chromium
        run: pnpm --filter @unlayer/react-elements exec playwright install --with-deps chromium

      # ── Browser import/runtime safety gate ──────────────────────
      # Bundles the shipped package entry as a browser consumer would, then
      # imports and renders inside Chromium without a Node `process` global.
      # Includes a negative control that reproduces the original
      # `process.env.IS_OFFLINE` crash so a green result proves the gate works.
      - name: Browser runtime safety gate
        run: pnpm --filter @unlayer/react-elements test:browser-runtime

      # ── Browser E2E gate (rendered documents) ───────────────────
      # Renders full documents with the BUILT dist for all three modes and
      # asserts in real Chromium: every <p> computes to 0px margins (the
      # inline reset beats the UA default), exactly one <body> in the DOM,
      # title/styles/links parsed, no console or page errors. Includes a
      # negative control proving the gate detects the failures it guards.
      - name: Browser E2E gate
        run: pnpm --filter @unlayer/react-elements test:e2e

      - name: Storybook smoke test
        run: pnpm --filter @unlayer/react-elements test-storybook:ci

      # ── Storybook visual-drift gate ─────────────────────────────
      # Fingerprints the computed styles of every story at desktop and
      # mobile widths (reusing the static build from the smoke test) and
      # diffs against the committed baseline. Fails naming the exact
      # stories and properties that changed — answers "did any story
      # change visually?" without paging through them by hand.
      - name: Storybook visual-drift gate
        run: pnpm --filter @unlayer/react-elements test:visual

      # ── Next.js integration test ────────────────────────────────
      # Packs the built react-elements as a tarball and installs it
      # in a real Next.js app — exactly like a consumer would.
      # Catches SSR, bundling, and Server Component compatibility issues
      # that unit tests can't detect.
      - name: Pack react-elements
        run: |
          cd packages/react
          pnpm pack --pack-destination /tmp
          echo "TARBALL=$(ls /tmp/unlayer-react-elements-*.tgz)" >> $GITHUB_ENV

      - name: Next.js integration build
        run: |
          cd tests/nextjs-integration
          npm install "$TARBALL"
          npm run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            coverage/
          retention-days: 30
