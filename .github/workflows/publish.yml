name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Pre-publish summary
        working-directory: packages/react
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEXT=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          CATALOG=$(grep -A10 "catalog:" ../../pnpm-workspace.yaml | grep "@unlayer" | sed 's/^ *//' | tr '\n' ', ')
          BUNDLE_SIZE=$(wc -c < dist/index.js | tr -d ' ')
          FILE_COUNT=$(find dist -type f | wc -l | tr -d ' ')

          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | @unlayer/react-elements |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${CURRENT} → ${NEXT} (${{ inputs.bump }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dependencies** | ${CATALOG} |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESM bundle** | ${BUNDLE_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files in dist** | ${FILE_COUNT} |" >> $GITHUB_STEP_SUMMARY

          echo "VERSION=${NEXT#v}" >> $GITHUB_ENV

      - name: Publish to npm
        run: pnpm publish -r --filter "./packages/react" --no-git-checks --access public

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/react/package.json
          git commit -m "v${VERSION}"
          git tag "v${VERSION}"
          git push && git push --tags
