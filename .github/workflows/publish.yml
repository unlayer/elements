# Release & Publish
#
# Gated publish flow, one package at a time:
#   1. PR merged to main → triggers build & test
#   2. Each package publishes only when its code changed since its last
#      release tag (Elements: v*, migrate: migrate-v*)
#   3. A reviewer approves each publish in the Actions UI (environment gate)
#   4. The package is published to npm via trusted publishing (OIDC)
#
# Version: reads the latest published version from npm and bumps from that.
# Defaults to patch. Add a `release:minor` or `release:major` PR label to
# override. Manual dispatch also supports bump selection. A version
# committed ahead of npm (a planned minor or major) wins over the bump.
#
# Auth: Uses npm trusted publishing (OIDC) — no NPM_TOKEN needed.
# The `npm-publish` environment must be configured in repo Settings →
# Environments with at least one required reviewer.
#
# npm trusted publishing must also be configured on npmjs.com, per package:
#   Package Settings → Publishing access → Add trusted publisher →
#     Repository:  unlayer/elements
#     Workflow:    publish.yml
#     Environment: npm-publish
# npm only offers this on a package that exists, so a new package's first
# version is published by hand, with its release tag (e.g. migrate-v0.1.0).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - react-elements
          - migrate
        default: react-elements
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  changes:
    name: Detect package changes
    runs-on: ubuntu-latest
    outputs:
      elements: ${{ steps.detect.outputs.elements }}
      migrate: ${{ steps.detect.outputs.migrate }}

    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compared with each package's last release tag, so a release that
      # failed or was rejected is retried on the next push. Fails open: a git
      # error counts as a change.
      - name: Detect changes since each package's last release
        id: detect
        shell: bash
        run: |
          changed() {
            local tag
            tag=$(git tag -l "$1" --sort=-v:refname | head -1)
            shift
            [ -z "$tag" ] && { echo true; return; }
            git diff --quiet "$tag" HEAD -- "$@" && echo false || echo true
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ELEMENTS=$([ "${{ inputs.package }}" = "react-elements" ] && echo true || echo false)
            MIGRATE=$([ "${{ inputs.package }}" = "migrate" ] && echo true || echo false)
          else
            ELEMENTS=$(changed 'v*' packages/react packages/shared pnpm-workspace.yaml)
            MIGRATE=$(changed 'migrate-v*' packages/migrate packages/from-react-email packages/convert-core)
          fi
          # The first version of a new package is published by hand (see above).
          if [ "$MIGRATE" = "true" ] && ! npm view @unlayer/migrate version >/dev/null 2>&1; then
            echo "::notice::@unlayer/migrate isn't on npm yet: publish its first version by hand, tag it migrate-v<version>, and add its trusted publisher."
            MIGRATE=false
          fi
          echo "elements=$ELEMENTS" >> $GITHUB_OUTPUT
          echo "migrate=$MIGRATE" >> $GITHUB_OUTPUT
          echo "Elements changed: $ELEMENTS, migrate changed: $MIGRATE"

  publish:
    name: Publish @unlayer/react-elements
    needs: [build-and-test, changes]
    if: needs.changes.outputs.elements == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      # setup-node with registry-url enables OIDC token exchange for npm publish.
      # All @unlayer deps are public — no NPM_TOKEN needed.
      - name: Setup Node.js 24 (with npm registry for OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT
          else
            # Check labels on the PR associated with this commit
            LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -Fxq "release:major"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -Fxq "release:minor"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        working-directory: packages/react
        run: |
          COMMITTED=$(node -p "require('./package.json').version")
          # Read latest published version from npm (falls back to package.json for first publish)
          CURRENT=$(npm view @unlayer/react-elements version 2>/dev/null || echo "$COMMITTED")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          # Write current version to package.json so npm version can bump from it
          npm version "$CURRENT" --no-git-tag-version --allow-same-version

          # Bump
          VERSION=$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)
          VERSION="${VERSION#v}"

          # A version committed ahead of npm (a planned minor or major) wins
          if [ "$COMMITTED" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$COMMITTED" | sort -V | tail -1)" = "$COMMITTED" ]; then
            npm version "$COMMITTED" --no-git-tag-version --allow-same-version
            VERSION="$COMMITTED"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Pre-publish summary
        working-directory: packages/react
        run: |
          CATALOG=$(grep -A10 "catalog:" ../../pnpm-workspace.yaml | grep "@unlayer" | sed 's/^ *//' | tr '\n' ', ')
          BUNDLE_SIZE=$(wc -c < dist/index.js | tr -d ' ')
          FILE_COUNT=$(find dist -type f | wc -l | tr -d ' ')

          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`@unlayer/react-elements\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.version }} (${{ steps.bump.outputs.type }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auth** | Trusted publishing (OIDC) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dependencies** | ${CATALOG} |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESM bundle** | ${BUNDLE_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files in dist** | ${FILE_COUNT} |" >> $GITHUB_STEP_SUMMARY

      # Two-step publish: pnpm pack resolves catalog: protocol to real
      # version numbers, then npm publish handles OIDC trusted publishing.
      # npm publish alone does NOT understand catalog: and would ship broken deps.
      # No --provenance flag — not supported for private source repos.
      - name: Publish to npm (trusted publishing)
        working-directory: packages/react
        run: |
          pnpm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/unlayer-react-elements-*.tgz)
          npm publish "$TARBALL" --access public

      - name: Tag release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin | awk '{print $2}' | grep -Fxq "refs/tags/$TAG"; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # Notes start at the previous Elements tag: migrate-v* tags don't match v*.
      - name: Create GitHub Release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREVIOUS=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^v[0-9]' | grep -vFx "$TAG" | sort -V | tail -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-migrate:
    name: Publish @unlayer/migrate
    needs: [build-and-test, changes, publish]
    # After Elements (when it publishes too), so the Elements range migrate requires is on npm.
    if: >-
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      needs.changes.outputs.migrate == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-migrate
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node.js 24 (with npm registry for OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT
          else
            LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -Fxq "release:major"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -Fxq "release:minor"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        working-directory: packages/migrate
        run: |
          COMMITTED=$(node -p "require('./package.json').version")
          CURRENT=$(npm view @unlayer/migrate version 2>/dev/null || echo "$COMMITTED")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          npm version "$CURRENT" --no-git-tag-version --allow-same-version
          VERSION=$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)
          VERSION="${VERSION#v}"
          if [ "$COMMITTED" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$COMMITTED" | sort -V | tail -1)" = "$COMMITTED" ]; then
            npm version "$COMMITTED" --no-git-tag-version --allow-same-version
            VERSION="$COMMITTED"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Packing writes `^<packages/react version>` as migrate's Elements range:
      # that release must be on npm, or installs would fail (or, with an older
      # range, silently use an Elements without the converter's settings).
      - name: Check the Elements range is published
        id: elements
        working-directory: packages/migrate
        run: |
          RANGE="^$(node -p "require('../react/package.json').version")"
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          for attempt in 1 2 3 4 5 6; do
            if [ -n "$(npm view "@unlayer/react-elements@$RANGE" version 2>/dev/null)" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::@unlayer/react-elements@$RANGE isn't on npm: release Elements first."
          exit 1

      - name: Pre-publish summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`@unlayer/migrate\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.version }} (${{ steps.bump.outputs.type }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Elements range** | ${{ steps.elements.outputs.range }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

      - name: Publish to npm (trusted publishing)
        working-directory: packages/migrate
        run: |
          pnpm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/unlayer-migrate-*.tgz)
          npm publish "$TARBALL" --access public

      - name: Tag release
        run: |
          TAG="migrate-v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin | awk '{print $2}' | grep -Fxq "refs/tags/$TAG"; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # Not marked latest: the repository's latest release stays Elements.
      - name: Create GitHub Release
        run: |
          TAG="migrate-v${{ steps.version.outputs.version }}"
          PREVIOUS=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^migrate-v[0-9]' | grep -vFx "$TAG" | sort -V | tail -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --title "@unlayer/migrate ${{ steps.version.outputs.version }}" \
              --generate-notes \
              --latest=false \
              ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
