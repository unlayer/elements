name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # PR previews publish unreviewed HTML to the live Pages origin, so they
    # are limited to same-repo branches (fork PRs also have a read-only
    # GITHUB_TOKEN and could never deploy — this skips the red-noise run).
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 9.7.0

      # No npm auth: all dependencies are public.

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @unlayer/react-elements run build-storybook

      # Get the GitHub Pages URL dynamically
      - name: Get Pages URL
        id: pages
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput('url', data.html_url);

      # Main branch → deploy to root
      - name: Deploy (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/react/storybook-static
          publish_branch: gh-pages

      - name: Print deploy URL (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "::notice::Storybook deployed to ${{ steps.pages.outputs.url }}"

      # PR → deploy to /pr/<number>/ subdirectory (doesn't touch main)
      - name: Deploy (PR preview)
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/react/storybook-static
          publish_branch: gh-pages
          destination_dir: pr/${{ github.event.pull_request.number }}

      - name: Print deploy URL (PR)
        if: github.event_name == 'pull_request'
        run: echo "::notice::Storybook preview deployed to ${{ steps.pages.outputs.url }}pr/${{ github.event.pull_request.number }}/"

      - name: Add Storybook link to PR description
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const url = `${{ steps.pages.outputs.url }}pr/${{ github.event.pull_request.number }}/`;
            const startMarker = '<!-- storybook-preview -->';
            const endMarker = '<!-- /storybook-preview -->';
            const link = `${startMarker}\n---\n📖 **Storybook Preview:** ${url}\n${endMarker}`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const body = pr.body || '';
            let newBody;
            if (body.includes(startMarker)) {
              newBody = body.replace(/<!-- storybook-preview -->[\s\S]*?<!-- \/storybook-preview -->/, link);
            } else {
              newBody = `${body}\n\n${link}`;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: newBody,
            });

  # Remove the pr/<number>/ preview from gh-pages when the PR closes so the
  # live origin doesn't accumulate stale unreviewed HTML.
  cleanup-preview:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          PR_DIR="pr/${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r --quiet "$PR_DIR"
            git commit -m "chore: remove Storybook preview for closed PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          else
            echo "No preview directory $PR_DIR — nothing to clean up"
          fi
