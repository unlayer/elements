name: Deploy Storybook PR Preview

on:
  workflow_run:
    workflows: ["Deploy Storybook to GitHub Pages"]
    types: [completed]

# This workflow runs with write access, so it must never check out or execute
# pull request code. It only publishes the static artifact produced by the
# read-only pull_request workflow.
permissions:
  actions: read
  contents: write
  pages: read
  pull-requests: write

jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: storybook-preview-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true

    steps:
      - name: Checkout trusted deployment workflow
        uses: actions/checkout@v4
        with:
          ref: main

      # workflow_run.pull_requests is empty for fork runs in this repository.
      # Resolve the PR from trusted event/API metadata instead of accepting a
      # contributor-controlled PR number from the artifact.
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const headOwner = run.head_repository.owner.login;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${headOwner}:${run.head_branch}`,
              per_page: 100,
            });
            const pull = pulls.find((candidate) =>
              candidate.head.repo?.id === run.head_repository.id &&
              candidate.head.sha === run.head_sha
            );
            if (!pull) {
              core.setFailed(`No open pull request matches workflow run ${run.id}`);
              return;
            }
            core.setOutput('number', pull.number);

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Get Pages URL
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput('url', data.html_url);

      - name: Deploy PR preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          destination_dir: pr/${{ steps.pr.outputs.number }}

      - name: Add Storybook link to PR description
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const url = `${{ steps.pages.outputs.url }}pr/${prNumber}/`;
            const startMarker = '<!-- storybook-preview -->';
            const endMarker = '<!-- /storybook-preview -->';
            const link = `${startMarker}\n---\n📖 **Storybook Preview:** ${url}\n${endMarker}`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const body = pr.body || '';
            const newBody = body.includes(startMarker)
              ? body.replace(/<!-- storybook-preview -->[\s\S]*?<!-- \/storybook-preview -->/, link)
              : `${body}\n\n${link}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody,
            });

      - name: Print deploy URL
        run: echo "::notice::Storybook preview deployed to ${{ steps.pages.outputs.url }}pr/${{ steps.pr.outputs.number }}/"
