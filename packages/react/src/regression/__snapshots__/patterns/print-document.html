<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{font-size:14px}main{box-sizing:border-box}main *,main :after,main :before{box-sizing:inherit}main p{margin:0}main sub,main sup{line-height:0}
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media screen { body { padding: 96px; } }
main { min-height: 100vh; }
.content { width: 100%; font-family: arial,helvetica,sans-serif; font-size: 15px; color: #000000; background-color: #F7F8F9; -webkit-print-color-adjust: exact; }</style>
</head>
<body style="margin:0;background-color:#f7f8f9">
<main style="max-width:100000px;margin:0 auto;display:flex;flex-direction:column;overflow-wrap:break-word;color:#000;font-family:arial,helvetica,sans-serif;font-size:15px;font-weight:400;font-style:normal;line-height:1.5;letter-spacing:0;text-align:left;text-transform:none">
<div style="display:flex;flex-direction:column">
<div style="align-self:center;display:flex;flex-direction:column;box-sizing:border-box;width:100%;max-width:500px">
<div style="display:flex">
<div style="flex:1 1 0%;min-width:0;display:flex;flex-direction:column">
<p style="margin:0;font-size:14px;line-height:1.4;box-sizing:border-box;padding:10px">A document</p>
</div>
</div>
</div>
</div>
</main>
</body>
</html>
