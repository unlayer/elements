      /* With Puppeteer's PDF margin set to 0 and the design margin applied
         via padding on the print-table cells (see ExportService.ts), the
         body fills the entire paper. Paint the body background here so the
         margin band (which the print-table reserves as cell padding) takes
         the same colour the editor canvas shows in DocumentViewer. */
      body {
        
          background-color: #F7F8F9;
        
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    

    .content {
      width: 100%;
      font-family: arial,helvetica,sans-serif;
      font-size: 15px;
      color: #000000;
      
        background-color: #F7F8F9;
      
      -webkit-print-color-adjust: exact;
    }

    
  

  
  
  #u_content_body_1 a {
  
    color: #0000ee;
    text-decoration: underline;
  }
  
  #u_content_body_1 a:hover {
    color: #0000ee;
    text-decoration: underline;
  }
  
  

</style>
</head>

<div>

}

  width: 100%;
  padding-right: 0;
