<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Hyper Elements agent benchmark</title>
<desc id="description">Five email briefs, 16 runs per approach. Median time to a passing email: Hyper Elements 35 seconds, hand-written HTML 65 seconds, React Email 76 seconds. Median output tokens: 2,346, 5,676, and 5,745 respectively. First-check passes: 11 of 16, 4 of 16, and 5 of 16. All 48 runs eventually passed. Measured with Claude Code and Claude Sonnet 5 on November 6, 2026.</desc>
<rect width="1600" height="900" rx="24" fill="#0d1117"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="56" y="65" font-size="20" fill="#ff776a" font-weight="600" letter-spacing="3">AGENT BENCHMARK</text>
<text x="56" y="127" font-size="50" fill="#f0f3f6" font-weight="700" letter-spacing="-1">Faster to a passing email.</text>
<text x="56" y="167" font-size="25" fill="#a6b0bf" >Same five briefs. Same checks. 16 runs per approach.</text>
<rect x="56" y="202" width="480" height="550" rx="20" fill="#141b24" stroke="#303945"/>
