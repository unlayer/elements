<text x="84" y="279" font-size="21" fill="#a6b0bf" >Median · lower is better</text>
<text x="84" y="342" font-size="48" fill="#ff776a" font-weight="700" letter-spacing="-1.5">2.2× faster</text>
<text x="84" y="374" font-size="21" fill="#a6b0bf" >than React Email</text>
<text x="84" y="427" font-size="23" fill="#ffffff" font-weight="600">Hyper Elements</text>
<text x="508" y="427" font-size="23" fill="#f0f3f6" text-anchor="end" font-weight="600">35 s</text>
